<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>当前页面岗位链接导出器</title>
  <style>
    body{font-family:"Microsoft YaHei",sans-serif;background:#f5f7fb;color:#1f2937;margin:0;min-height:100vh;display:grid;place-items:center}
    main{width:min(680px,calc(100% - 48px));background:white;padding:34px;border:1px solid #dbe4ef;border-radius:16px;box-shadow:0 16px 45px #1e325015}
    h1{margin-top:0;color:#17365d}li,p{line-height:1.8}.button{display:inline-block;padding:12px 20px;border-radius:9px;background:#2369a8;color:white;text-decoration:none;font-weight:700;cursor:grab}.note{color:#667085}
  </style>
</head>
<body><main>
  <h1>当前页面岗位链接导出器</h1>
  <ol>
    <li>在浏览器中正常登录招聘网站并打开岗位列表，等待岗位卡片加载完成。</li>
    <li>显示书签栏，把下面的按钮拖到书签栏。</li>
    <li>回到岗位列表页，点击书签栏中的“导出当前岗位”。</li>
    <li>浏览器会在本地下载 <strong>job_list.csv</strong>。</li>
  </ol>
  <a id="bookmarklet" class="button" href="#">导出当前岗位</a>
  <p class="note">支持猎聘、Boss直聘、智联招聘、前程无忧、拉勾和 LinkedIn/领英。只读取当前页面已经显示的链接文字和网址，不读取密码、不发送数据、不自动翻页，也不绕过网站验证。</p>
  <script>
    const code=`(()=>{const adapters=[{id:"liepin",label:"猎聘",host:/(^|\\.)liepin\\.com$/i,path:/^\\\/(?:job|a)\\\/\\d+\\.shtml$/i},{id:"boss",label:"Boss直聘",host:/(^|\\.)zhipin\\.com$/i,path:/^\\\/job_detail\\\/[^/]+\\.html$/i},{id:"zhaopin",label:"智联招聘",host:/(^|\\.)zhaopin\\.com$/i,path:/^\\\/jobdetail\\\/[^/]+\\.html?$/i},{id:"51job",label:"前程无忧",host:/(^|\\.)51job\\.com$/i,path:/(?:^\\\/pc\\\/jobdetail\\\/|^\\\/(?:job|jobs)\\\/|\\\/\\d+\\.html$)/i},{id:"lagou",label:"拉勾",host:/(^|\\.)lagou\\.com$/i,path:/^\\\/(?:wn\\\/)?jobs\\\/\\d+\\.html$/i},{id:"linkedin",label:"LinkedIn",host:/(^|\\.)linkedin\\.com$/i,path:/^\\\/jobs\\\/view\\\/[^/]+\\\/?$/i}];const clean=v=>(v||"").replace(/\\s+/g," ").trim();const identify=href=>{try{const u=new URL(href,location.href);const adapter=adapters.find(x=>x.host.test(u.hostname)&&x.path.test(u.pathname));if(!adapter)return null;u.search="";u.hash="";return{platform:adapter.id,label:adapter.label,url:u.href}}catch{return null}};const titleOf=a=>{const selectors=['[class*="job-name"]','[class*="job-title"]','[class*="position-name"]','strong','h3'];const values=[...selectors.map(s=>a.querySelector?.(s)?.innerText),a.getAttribute?.("aria-label"),a.getAttribute?.("title"),a.innerText,a.textContent].map(clean).filter(Boolean);return values.find(v=>v.length<=180)||values[0]||"未识别岗位名称"};const rows=[...document.querySelectorAll("a[href]")].map(a=>{const hit=identify(a.href);return hit?{...hit,title:titleOf(a)}:null}).filter(Boolean);const unique=[...new Map(rows.map(x=>[x.url,x])).values()];if(!unique.length){alert("没有找到受支持的岗位详情链接。请确认岗位卡片已加载，必要时先滚动列表。");return}const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const now=new Date().toISOString();const source=location.href;const csv="\\ufeff平台,岗位名称,详情页链接,来源页面,导出时间\\n"+unique.map(x=>[x.platform,x.title,x.url,source,now].map(q).join(",")).join("\\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="job_list_"+new Date().toISOString().slice(0,10)+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);const counts=unique.reduce((m,x)=>(m[x.label]=(m[x.label]||0)+1,m),{});alert("已导出 "+unique.length+" 个岗位："+Object.entries(counts).map(([k,v])=>k+" "+v).join("，"));})()`;
    document.getElementById("bookmarklet").href="javascript:"+code;
  </script>
</main></body></html>
